[package]
name = "aws-sso-rs"
version = "1.7.0"
edition = "2024"
authors = ["containerscrew info@containerscrew.com"]
repository = "https://github.com/containerscrew/aws-sso-rs"
license = "GPL-3.0-only"
description = "Fetch your ~/.aws/credentials using AWS SSO"
readme = "README.md"
keywords = ["aws", "sso", "credentials", "cli", "aws-sso"]
categories = ["command-line-utilities"]
exclude = [
    ".github/",
    "AGENTS.md",
    ".pre-commit-config.yaml",
    "assets/",
    "cog.toml",
    "install.sh",
    "roadmap.md",
    "rust-toolchain.toml",
    "rustfmt.toml",
]

[dependencies]
console = "0.16.0"
tracing-subscriber = { version = "0.3.17", features = ["json"] }
tracing = "0.1.40"
clap = { version = "4.4.18", features = ["derive"] }
aws-config = "1.6.3"
aws-sdk-sso = { version = "1.72.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1.45.0", features = ["full", "time"] }
aws-sdk-ssooidc = { version = "1.73.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
webbrowser = "1.0.4"
shellexpand = "3.1.1"
configparser = "3.1.0"
tiny-tracing = "0.4.0"
futures-util = "0.3"

[profile.release]
strip = "debuginfo"

[dev-dependencies]
mockall = "0.15.0"
